spring:
  datasource:
    url: jdbc:h2:mem:agvtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

agv:
  jwt:
    secret: test-secret-key-for-unit-tests-0123456789
    expire-hours: 1
