# 本地开发：H2 文件库，免安装 MySQL 即可跑通全流程
# 数据落在 ./data/agvdb.mv.db，重启不丢；升级已有库由 Flyway baseline 处理
spring:
  datasource:
    url: jdbc:h2:file:./data/agvdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration/h2
  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
      path: /h2-console
