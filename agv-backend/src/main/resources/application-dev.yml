# 本地开发：H2 文件库，免安装 MySQL 即可跑通全流程
# 数据落在 ./data/agvdb.mv.db，重启不丢
spring:
  datasource:
    url: jdbc:h2:file:./data/agvdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
