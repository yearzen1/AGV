# 论文与答辩用：MySQL 8+
# 用法：先建库 CREATE DATABASE agv_sim DEFAULT CHARSET utf8mb4;
#      mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#      密码通过环境变量 MYSQL_PASSWORD 传入，不写进仓库
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/agv_sim?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
